<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级日程提醒</title>
    <style>
        /* 全局样式：彻底抛弃宋体，使用微软雅黑 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 顶部滚动横幅样式 */
        .marquee-container {
            position: absolute;
            top: 0;
            width: 100%;
            background-color: #e74c3c;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        marquee { color: #fff; }

        /* 主内容区域样式 */
        .content-box {
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        /* 大字报核心文字样式 */
        .main-text {
            font-size: 5vw;
            font-weight: 900;
            line-height: 1.3;
            color: #f1c40f;
            text-shadow: 3px 3px 0 #e74c3c, 6px 6px 0 rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        /* 倒计时通用样式 */
        .countdown {
            font-size: 3vw;
            font-weight: bold;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace; /* 等宽字体，数字跳动不闪烁 */
        }
        .countdown.practice { color: #3498db; } /* 练字倒计时：蓝色 */
        .countdown.discuss { color: #2ecc71; }  /* 讨论倒计时：绿色 */

        /* 未到时间的提示文字样式 */
        .sub-text {
            font-size: 3vw;
            color: #bdc3c7;
            margin-top: 30px;
            line-height: 1.6;
        }

        /* 科目表样式（常驻底部） */
        .schedule {
            position: absolute;
            bottom: 30px;
            font-size: 2.5vw;
            line-height: 1.8;
            color: #ecf0f1;
            background: rgba(255,255,255,0.1);
            padding: 15px 40px;
            border-radius: 10px;
            display: inline-block;
        }
        .schedule span { color: #f1c40f; font-weight: bold; }

        /* 呼吸闪烁动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 顶部滚动横幅 -->
    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="8">
            张正凯老师提醒您：把电子教室连起来哦 📢 张正凯老师提醒您：把电子教室连起来哦 📢
        </marquee>
    </div>

    <!-- 主内容区域 -->
    <div class="content-box">
        <div id="mainDisplay"></div>
        <div id="countdownDisplay"></div>
        <div id="discussCountdownDisplay" class="countdown discuss"></div>
    </div>

    <!-- 常驻底部的科目表 -->
    <div id="scheduleDisplay" class="schedule"></div>

    <script>
        // 科目表配置
        const scheduleMap = {
            0: '语文', 1: '数学', 2: '英语', 3: '物理', 4: '化学', 5: '生物学', 6: '语文'
        };

        // 检查当前时间并更新页面的函数
        function checkTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            const mainDisplay = document.getElementById('mainDisplay');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const discussCountdownDisplay = document.getElementById('discussCountdownDisplay');
            const scheduleDisplay = document.getElementById('scheduleDisplay');

            // 计算今天和明天的星期
            const today = now.getDay();
            const tomorrow = (today + 1) % 7;

            // 1. 始终显示科目表
            scheduleDisplay.innerHTML = `今日科目：<span>${scheduleMap[today]}</span> | 明日科目：<span>${scheduleMap[tomorrow]}</span>`;

            // 2. 始终显示距离小组讨论的倒计时
            let discussTarget = new Date(now);
            discussTarget.setHours(22, 30, 0, 0);
            let discussDiff = discussTarget - now;
            if (discussDiff > 0) {
                discussCountdownDisplay.innerHTML = `距离小组讨论还有：${formatTime(discussDiff)}`;
            } else {
                discussCountdownDisplay.innerHTML = `小组讨论进行中...`;
            }

            // 3. 根据时间段切换主提示和练字倒计时
            mainDisplay.innerHTML = '';
            countdownDisplay.innerHTML = '';

            // 判断是否到了 22:30 或之后
            if (hours > 22 || (hours === 22 && minutes >= 30)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = '什么时间该做什么事了哦，<br>昨天的讨论已经开了个好头了哦。<br><span style="font-size:0.8em; color:#fff;">张正凯老师友情提示：<br>把你们的数理化作业收起来哦！</span>';

            } 
            // 判断是否到了 18:50 或之后
            else if (hours > 18 || (hours === 18 && minutes >= 50)) {
                mainDisplay.className = 'main-text';
                mainDisplay.innerHTML = '什么时间该做什么事了，<br>不需要我多说了吧！';

            } 
            // 18:50 之前
            else {
                mainDisplay.className = 'sub-text';
                mainDisplay.innerHTML = '语文也是150分哦，虽然不像数学物理那么难学，但也是重要的哦 ✍️';
                
                // 显示练字倒计时
                let practiceTarget = new Date(now);
                practiceTarget.setHours(18, 50, 0, 0);
                let practiceDiff = practiceTarget - now;
                if (practiceDiff > 0) {
                    countdownDisplay.className = 'countdown practice';
                    countdownDisplay.innerHTML = `距离练字还有：${formatTime(practiceDiff)}`;
                }
            }
        }

        // 格式化时间函数
        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let s = String(totalSec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 页面加载时立即执行一次
        checkTime();
        // 每秒钟检查一次时间
        setInterval(checkTime, 1000);
    </script>
</body>
</html>
